name: Check legal sources
on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus-check
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-vie poppler-utils
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Collect into staging only
        run: land-law ingest --ocr
      - name: Compress staging within free artifact storage
        if: always()
        run: |
          if [ -d data/staging ]; then
            tar -czf /tmp/corpus-staging.tar.gz data/staging reports/corpus-coverage.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-staging
          path: /tmp/corpus-staging.tar.gz
          retention-days: 3
