name: Deploy application
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Source commit to deploy (empty means the selected workflow revision)'
        required: false
        type: string
      verify_public_chat:
        description: 'Also attempt chat with the real managed Turnstile challenge'
        required: false
        type: boolean
        default: false
concurrency:
  group: production-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ALLOW_STALE_GENERATION: ${{ vars.ALLOW_STALE_GENERATION || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Pin committed application source
        id: readiness
        run: |
          python - <<'PY'
          import os
          from scripts.deploy import preflight
          commit = preflight()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tested_commit='+commit+'\n')
          PY
      - run: npm ci && npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - run: env -u ALLOW_STALE_GENERATION python -m pytest -q && python scripts/check_secrets.py
      - run: npm test
        working-directory: frontend
      - name: Deploy frontend
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          DEPLOY_SOURCE_COMMIT: ${{ steps.readiness.outputs.tested_commit }}
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main --commit-hash="$DEPLOY_SOURCE_COMMIT"
      - name: Deploy existing free backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          DEPLOY_SOURCE_COMMIT: ${{ steps.readiness.outputs.tested_commit }}
        run: python scripts/deploy.py backend
      - name: Verify live navigation and source identity
        run: npx --prefix frontend playwright install --with-deps chromium && node scripts/verify_live_ui.mjs
        env:
          LIVE_BASE_URL: ${{ vars.API_BASE_URL }}
          LIVE_EXPECTED_CORPUS: ${{ vars.CORPUS_RELEASE }}
          LIVE_REPORT_DIR: reports/deployment-live
      - name: Optional public chat verification
        if: ${{ inputs.verify_public_chat }}
        run: node scripts/verify_live_ui.mjs --chat
        env:
          LIVE_BASE_URL: ${{ vars.API_BASE_URL }}
          LIVE_REPORT_DIR: reports/deployment-chat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence
          path: |
            reports/deployments
            reports/deployment-live
            reports/deployment-chat
