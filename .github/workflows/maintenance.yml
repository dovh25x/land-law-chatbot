name: Backup and retention
on:
  schedule:
    - cron: '31 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maintenance:
    if: vars.MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: land-law cleanup
      - name: Backup corpus and release pointers
        if: github.event_name == 'workflow_dispatch' || github.run_number % 7 == 0
        run: land-law backup --output data/backups/latest.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.run_number % 7 == 0
        with:
          name: corpus-backup
          path: data/backups/latest.json
          retention-days: 14
