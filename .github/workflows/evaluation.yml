name: Academic twenty-case evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python backend/landlaw/local_embedding.py download models/e5
      - run: land-law benchmark --split smoke --mode agentic --concurrency 1
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_MODEL: openai/gpt-oss-120b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academic-evaluation-awaiting-review
          path: reports/
