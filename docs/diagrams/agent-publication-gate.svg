<rect class="focus" x="1008" y="484" width="224" height="72" rx="6"/><text class="name" x="1120.0" y="512" text-anchor="middle">Thiếu chứng cứ</text><text class="detail" x="1120.0" y="532" text-anchor="middle">Loại nhóm claim và citation</text><text class="detail" x="656" y="128" text-anchor="start">Tại finish, sau retry / repair nếu có</text><text class="detail" x="656" y="152" text-anchor="start">Đủ claim được duyệt; không issues</text><text class="detail" x="656" y="172" text-anchor="start">Không needs_more_evidence; đúng phạm vi</text><text class="legend" x="40" y="656" text-anchor="start">Lỗi còn tồn tại phủ quyết phát hành, kể cả khi verifier duyệt tất cả index.</text><text class="legend" x="40" y="680" text-anchor="start">Claim tương lai phải nêu rõ chưa có hiệu lực trước verify; finish không tự nối điều kiện.</text>
<text class="legend" x="40" y="704">Nguồn quá hạn: strict dừng; snapshot được cho phép: ghi metadata và reports.</text></svg>
