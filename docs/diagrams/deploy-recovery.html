<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
<style>.node{fill:#fff;stroke:#4f5d75;stroke-width:1}.focus{fill:#fff;stroke:#bf4520;stroke-width:2}.label{font:500 18px 'Geist',system-ui,sans-serif;fill:#2d3142}.detail{font:400 14px 'Geist',system-ui,sans-serif;fill:#4f5d75}.heading{font:400 32px 'Instrument Serif',serif;fill:#2d3142}.edge{fill:none;stroke:#4f5d75;stroke-width:1.5;marker-end:url(#arrow)}.life{fill:none;stroke:#4f5d75;stroke-width:1;stroke-dasharray:4 6}</style></head>
<body><main class="frame"><div class="diagram-container"><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deploy-recovery-title deploy-recovery-desc"><title id="deploy-recovery-title">Triển khai và phục hồi</title><desc id="deploy-recovery-desc">Source đã kiểm thử được deploy đúng SHA; kiểm chứng live rồi chỉ cho phép rollback về phiên bản bảo toàn dữ liệu và phạm vi.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#4f5d75"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text class="heading" x="40" y="56">Triển khai và phục hồi</text><rect class="node" x="40" y="132" width="224" height="88" rx="8"/><text class="label" x="56" y="164">Source đã kiểm thử</text><text class="detail" x="56" y="192">Commit SHA · CI</text><rect class="node" x="368" y="132" width="224" height="88" rx="8"/><text class="label" x="384" y="164">Deploy tuần tự</text><text class="detail" x="384" y="192">Pages Functions + Render</text><rect class="focus" x="696" y="132" width="224" height="88" rx="8"/><text class="label" x="712" y="164">Kiểm chứng live</text><text class="detail" x="712" y="192">SHA · corpus · fingerprint</text><path class="edge" d="M264 176H368"/><path class="edge" d="M592 176H696"/><rect class="node" x="696" y="372" width="224" height="88" rx="8"/><text class="label" x="712" y="404">Có sự cố</text><text class="detail" x="712" y="432">Tắt generation</text><rect class="focus" x="368" y="372" width="224" height="88" rx="8"/><text class="label" x="384" y="404">Restore riêng</text><text class="detail" x="384" y="432">Corpus-only · checksum</text><rect class="node" x="40" y="372" width="224" height="88" rx="8"/><text class="label" x="56" y="404">Khôi phục phù hợp</text><text class="detail" x="56" y="432">Một dự án · client history</text><path class="edge" d="M808 220V372"/><path class="edge" d="M696 416H592"/><path class="edge" d="M368 416H264"/><text class="detail" x="40" y="540">Thư viện nguồn vẫn hoạt động khi generation dừng</text><text class="detail" x="40" y="564">Rubric không chặn deploy · Kiểm chứng claim vẫn bắt buộc</text></svg></div></main></body></html>
