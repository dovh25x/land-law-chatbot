</defs>
<text x="40" y="52" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#202123">Kiến trúc triển khai: Bounded Agentic RAG</text><text x="40" y="76" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#62666d">Người dân ↔ Cloudflare ↔ FastAPI/Render ↔ Groq; PostgreSQL chỉ được đọc bởi tool phía server.</text><rect x="40" y="116" width="200" height="84" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="56" y="150" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Trình duyệt</text><text x="56" y="174" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">React · IndexedDB 7 ngày</text><rect x="300" y="116" width="200" height="84" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="316" y="150" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Cloudflare Pages</text><text x="316" y="174" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">Function ký HMAC · ingress</text><rect x="560" y="116" width="200" height="84" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="576" y="150" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">FastAPI · Render</text><text x="576" y="174" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">session · quota · lease</text><rect x="820" y="116" width="180" height="84" rx="6" fill="#ffffff" stroke="#805400" stroke-width="2"/><text x="836" y="150" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Groq GPT-OSS 120B</text><text x="836" y="174" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">tool calling · generation</text><path d="M240 158H300" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#architecture-arrow)"/><path d="M500 158H560" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#architecture-arrow)"/><path d="M760 158H820" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#architecture-arrow)"/><rect x="300" y="280" width="300" height="96" rx="6" fill="#ffffff" stroke="#805400" stroke-width="2"/><text x="316" y="314" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Bounded Agentic RAG</text><text x="316" y="338" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">1 tool decision + 1 final · 2 request</text><text x="620" y="306" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">≤3 request · ≤2 tool</text><text x="620" y="326" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">Không repair loop</text><path d="M450 280V240H860V200" fill="none" stroke="#805400" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-arrow-accent)"/><rect x="594.5" y="216" width="111" height="22" rx="3" fill="#ffffff"/><text x="650" y="232" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">TOOL DECISION</text><path d="M940 200V260H520V280" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#architecture-arrow)"/><rect x="686.5" y="236" width="97" height="22" rx="3" fill="#ffffff"/><text x="735" y="252" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">TOOL RESULT</text><rect x="40" y="280" width="240" height="96" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="56" y="314" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Read-only tools</text><text x="56" y="338" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">2 tool đọc-only · validate args</text><rect x="40" y="440" width="220" height="96" rx="6" fill="#f7f7f8" stroke="#62666d" stroke-width="1"/><text x="56" y="474" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">PostgreSQL / pgvector</text><text x="56" y="498" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">corpus · receipts · policy</text><rect x="300" y="440" width="300" height="96" rx="6" fill="#f7f7f8" stroke="#62666d" stroke-width="1"/><text x="316" y="474" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Source policy v2</text><text x="316" y="498" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">standing snapshot · 43 admitted</text><rect x="660" y="280" width="340" height="96" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="676" y="314" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Claim-aware citation guard</text><text x="676" y="338" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">marker theo câu · điều/khoản · nguồn</text><path d="M300 328H280" fill="none" stroke="#805400" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-arrow-accent)"/><path d="M150 376V440" fill="none" stroke="#805400" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-arrow-accent)"/><rect x="148.5" y="402" width="83" height="22" rx="3" fill="#ffffff"/><text x="190" y="418" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">RETRIEVAL</text><path d="M260 488H300" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#architecture-arrow)"/><path d="M450 440V376" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#architecture-arrow)"/><rect x="462.0" y="400" width="76" height="22" rx="3" fill="#ffffff"/><text x="500" y="416" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">EVIDENCE</text><path d="M600 328H660" fill="none" stroke="#805400" stroke-width="2" stroke-linejoin="round" marker-end="url(#architecture-arrow-accent)"/><rect x="594.0" y="302" width="72" height="22" rx="3" fill="#ffffff"/><text x="630" y="318" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">DRAFT</text><text x="40" y="580" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#62666d">Groq không truy vấn PostgreSQL: mọi truy xuất do ứng dụng thực thi; history chỉ nằm trong trình duyệt.</text>
