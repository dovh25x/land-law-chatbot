<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">Kiến trúc triển khai Bounded Agentic RAG</title>
<desc id="architecture-desc">Trình duyệt, Cloudflare, FastAPI trên Render, Groq, tool đọc-only, PostgreSQL và claim-aware citation guard.</desc>
<defs>
      <style>#architecture-root { font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #202123; }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }</style>
  <marker id="architecture-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#62666d"/></marker>
