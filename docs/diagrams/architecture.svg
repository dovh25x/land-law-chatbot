<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root"><title id="architecture-title">Kiến trúc hệ thống</title><desc id="architecture-desc">Hội thoại lưu phía client; Cloudflare ký ingress cho Render, pipeline truy xuất nguồn và gọi Groq.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .diagram-container { overflow-x: visible; }
      #architecture-root .node { fill:#fff;stroke:#4f5d75;stroke-width:1 }
      #architecture-root .focus { fill:#fff;stroke:#bf4520;stroke-width:2 }
      #architecture-root .label { font:500 18px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #architecture-root .detail { font:400 14px 'Geist',system-ui,sans-serif;fill:#4f5d75 }
      #architecture-root .heading { font:400 32px 'Instrument Serif',serif;fill:#2d3142 }
      #architecture-root .edge { fill:none;stroke:#4f5d75;stroke-width:1.5;marker-end:url(#architecture-arrow) }
      #architecture-root .life { fill:none;stroke:#4f5d75;stroke-width:1;stroke-dasharray:4 6 }</style><marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#4f5d75"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text class="heading" x="40" y="56">Kiến trúc hệ thống</text><rect class="node" x="40" y="132" width="224" height="88" rx="8"/><text class="label" x="56" y="164">Trình duyệt</text><text class="detail" x="56" y="192">React · IndexedDB 7 ngày</text><rect class="node" x="368" y="132" width="224" height="88" rx="8"/><text class="label" x="384" y="164">Cloudflare</text><text class="detail" x="384" y="192">Pages Function · HMAC</text><rect class="focus" x="696" y="132" width="224" height="88" rx="8"/><text class="label" x="712" y="164">Render</text><text class="detail" x="712" y="192">FastAPI · quota · lease</text><path class="edge" d="M264 176H368"/><path class="edge" d="M592 176H696"/><rect class="node" x="40" y="372" width="224" height="88" rx="8"/><text class="label" x="56" y="404">Corpus</text><text class="detail" x="56" y="432">PostgreSQL / pgvector</text><rect class="focus" x="368" y="372" width="224" height="88" rx="8"/><text class="label" x="384" y="404">Agentic RAG</text><text class="detail" x="384" y="432">Retrieval → verify</text><rect class="node" x="696" y="372" width="224" height="88" rx="8"/><text class="label" x="712" y="404">Groq</text><text class="detail" x="712" y="432">GPT-OSS 120B</text><path class="edge" d="M808 220V296H480V372"/><path class="edge" d="M368 416H264"/><path class="edge" d="M592 416H696"/><text class="detail" x="40" y="540">Chỉ metadata trên server · Nội dung được gửi tới provider để xử lý</text></svg>
