<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chat-sequence-title chat-sequence-desc" id="chat-sequence-root"><title id="chat-sequence-title">Một lượt hỏi và đáp án đã kiểm chứng</title><desc id="chat-sequence-desc">Client gửi history không đáng tin; server truy xuất và verify lại trước SSE; đáp án chỉ lưu tại client.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #chat-sequence-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #chat-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #chat-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      #chat-sequence-root .diagram-container { overflow-x: visible; }
      #chat-sequence-root .node { fill:#fff;stroke:#4f5d75;stroke-width:1 }
      #chat-sequence-root .focus { fill:#fff;stroke:#bf4520;stroke-width:2 }
      #chat-sequence-root .label { font:500 18px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #chat-sequence-root .detail { font:400 14px 'Geist',system-ui,sans-serif;fill:#4f5d75 }
      #chat-sequence-root .heading { font:400 32px 'Instrument Serif',serif;fill:#2d3142 }
      #chat-sequence-root .edge { fill:none;stroke:#4f5d75;stroke-width:1.5;marker-end:url(#chat-sequence-arrow) }
      #chat-sequence-root .life { fill:none;stroke:#4f5d75;stroke-width:1;stroke-dasharray:4 6 }</style><marker id="chat-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><text class="heading" x="40" y="56">Một lượt hỏi và đáp án đã kiểm chứng</text><rect class="node" x="48" y="100" width="224" height="88" rx="8"/><text class="label" x="64" y="132">Trình duyệt</text><text class="detail" x="64" y="160"></text><path class="life" d="M160 188V632"/><rect class="node" x="368" y="100" width="224" height="88" rx="8"/><text class="label" x="384" y="132">Cloudflare</text><text class="detail" x="384" y="160"></text><path class="life" d="M480 188V632"/><rect class="node" x="688" y="100" width="224" height="88" rx="8"/><text class="label" x="704" y="132">API / agent</text><text class="detail" x="704" y="160"></text><path class="life" d="M800 188V632"/><rect class="node" x="1008" y="100" width="224" height="88" rx="8"/><text class="label" x="1024" y="132">Groq + corpus</text><text class="detail" x="1024" y="160"></text><path class="life" d="M1120 188V632"/><path class="edge" d="M160 236H480"/><text class="detail" x="176" y="224">Câu hỏi + history + request_id</text><path class="edge" d="M480 300H800"/><text class="detail" x="496" y="288">HMAC · quota · lease</text><path class="edge" d="M800 364H1120"/><text class="detail" x="816" y="352">Retrieval → synthesis → verify</text><path class="edge" d="M1120 428H800"/><text class="detail" x="816" y="416">Chứng cứ + kết quả kiểm tra</text><path class="edge" d="M800 492H480"/><text class="detail" x="496" y="480">SSE progress / result hoặc failure</text><path class="edge" d="M480 556H160"/><text class="detail" x="176" y="544">Lưu kết quả tại IndexedDB</text><text class="detail" x="48" y="680">Mất kết nối: không replay server · Chỉ gửi lượt mới khi người dùng chủ động</text></svg>
