<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-flow-title agent-flow-desc" id="agent-flow-root">
<title id="agent-flow-title">Agent flow: truy xuất trước, kiểm chứng trước khi trả lời</title>
<desc id="agent-flow-desc">Graph một agent với truy xuất bổ sung, tối đa một repair và cổng phát hành chặn kết luận chưa đủ chứng cứ.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #agent-flow-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #agent-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #agent-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #agent-flow-root .diagram-container { overflow-x: visible; }
      #agent-flow-root .node { fill:#fff;stroke:#4f5d75;stroke-width:1 }
      #agent-flow-root .focus { fill:#fff;stroke:#bf4520;stroke-width:2 }
      #agent-flow-root .decision { fill:#fff;stroke:#4f5d75;stroke-width:1 }
      #agent-flow-root .name { font:600 12px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #agent-flow-root .detail { font:400 11px 'Geist',system-ui,sans-serif;fill:#4f5d75 }
      #agent-flow-root .technical { font:400 9px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75 }
      #agent-flow-root .heading { font:400 28px 'Instrument Serif','Noto Serif',serif;fill:#2d3142 }
      #agent-flow-root .arrow-label { font:400 8px 'Geist Mono',ui-monospace,monospace;fill:#4f5d75;letter-spacing:.06em }
      #agent-flow-root .edge { fill:none;stroke:#4f5d75;stroke-width:1.5;marker-end:url(#agent-flow-arrow) }
      #agent-flow-root .legend { font:400 11px 'Geist',system-ui,sans-serif;fill:#4f5d75 }</style><marker id="agent-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#4f5d75"/></marker></defs>
