<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="corpus-lifecycle-title corpus-lifecycle-desc" id="corpus-lifecycle-root">
<title id="corpus-lifecycle-title">Vòng đời corpus và rollback</title>
<desc id="corpus-lifecycle-desc">Nguồn chính thức, chuẩn hóa, release, chuyển active và rollback corpus.</desc>
<defs>
      <style>#corpus-lifecycle-root { font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #202123; }
      #corpus-lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }</style>
  <marker id="corpus-lifecycle-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#62666d"/></marker>
  <marker id="corpus-lifecycle-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#805400"/></marker>
</defs>
<text x="40" y="52" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#202123">Vòng đời corpus và rollback</text><text x="40" y="76" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#62666d">Mỗi release giữ E5 contract và checksum; rollback chỉ về corpus một dự án.</text><rect x="40" y="116" width="180" height="84" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="56" y="150" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Nguồn chính thức</text><text x="56" y="174" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">URL · ngày · checksum</text><rect x="270" y="116" width="180" height="84" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="286" y="150" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Chuẩn hóa</text><text x="286" y="174" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">parse/OCR · locator</text><rect x="500" y="116" width="200" height="84" rx="6" fill="#f7f7f8" stroke="#62666d" stroke-width="1"/><text x="516" y="150" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Corpus Vành đai 4</text><text x="516" y="174" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">luật chung vẫn giữ</text><rect x="750" y="116" width="250" height="84" rx="6" fill="#ffffff" stroke="#805400" stroke-width="2"/><text x="766" y="150" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Snapshot mới</text><text x="766" y="174" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">corpus ID mới · E5 giữ nguyên</text><path d="M220 158H270" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#corpus-lifecycle-arrow)"/><path d="M450 158H500" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#corpus-lifecycle-arrow)"/><path d="M700 158H750" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#corpus-lifecycle-arrow)"/><rect x="750" y="280" width="250" height="84" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="766" y="314" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Release + restore</text><text x="766" y="338" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">SHA256 · DB riêng</text><rect x="420" y="280" width="280" height="84" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="436" y="314" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Chuyển active</text><text x="436" y="338" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">giữ bản cũ để rollback</text><rect x="40" y="280" width="330" height="84" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="56" y="314" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Không backup hội thoại</text><text x="56" y="338" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">history thuộc trình duyệt</text><path d="M875 200V280" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#corpus-lifecycle-arrow)"/><path d="M750 322H700" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#corpus-lifecycle-arrow)"/><path d="M420 322H370" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#corpus-lifecycle-arrow)"/><text x="40" y="440" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#62666d">Không sửa artifact lịch sử; mọi thay đổi corpus phải tạo release/candidate riêng.</text>
</svg>
