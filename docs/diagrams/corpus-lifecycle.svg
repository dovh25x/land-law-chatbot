<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="corpus-lifecycle-title corpus-lifecycle-desc" id="corpus-lifecycle-root"><title id="corpus-lifecycle-title">Vòng đời corpus</title><desc id="corpus-lifecycle-desc">Nguồn chính thức được chuẩn hóa, giữ embedding và khôi phục kiểm chứng trước khi chuyển active và thu hồi asset cũ.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #corpus-lifecycle-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #corpus-lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #corpus-lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }
      #corpus-lifecycle-root .diagram-container { overflow-x: visible; }
      #corpus-lifecycle-root .node { fill:#fff;stroke:#4f5d75;stroke-width:1 }
      #corpus-lifecycle-root .focus { fill:#fff;stroke:#bf4520;stroke-width:2 }
      #corpus-lifecycle-root .label { font:500 18px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #corpus-lifecycle-root .detail { font:400 14px 'Geist',system-ui,sans-serif;fill:#4f5d75 }
      #corpus-lifecycle-root .heading { font:400 32px 'Instrument Serif',serif;fill:#2d3142 }
      #corpus-lifecycle-root .edge { fill:none;stroke:#4f5d75;stroke-width:1.5;marker-end:url(#corpus-lifecycle-arrow) }
      #corpus-lifecycle-root .life { fill:none;stroke:#4f5d75;stroke-width:1;stroke-dasharray:4 6 }</style><marker id="corpus-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#4f5d75"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text class="heading" x="40" y="56">Vòng đời corpus</text><rect class="node" x="40" y="132" width="224" height="88" rx="8"/><text class="label" x="56" y="164">Nguồn chính thức</text><text class="detail" x="56" y="192">Checksum · ngày kiểm tra</text><rect class="node" x="368" y="132" width="224" height="88" rx="8"/><text class="label" x="384" y="164">Chuẩn hóa</text><text class="detail" x="384" y="192">Parse / OCR · locator</text><rect class="focus" x="696" y="132" width="224" height="88" rx="8"/><text class="label" x="712" y="164">Corpus Vành đai 4</text><text class="detail" x="712" y="192">Luật chung được giữ</text><path class="edge" d="M264 176H368"/><path class="edge" d="M592 176H696"/><rect class="node" x="696" y="372" width="224" height="88" rx="8"/><text class="label" x="712" y="404">Snapshot mới</text><text class="detail" x="712" y="432">Giữ E5 · corpus ID mới</text><rect class="focus" x="368" y="372" width="224" height="88" rx="8"/><text class="label" x="384" y="404">Release + restore</text><text class="detail" x="384" y="432">SHA256 · kiểm tra riêng</text><rect class="node" x="40" y="372" width="224" height="88" rx="8"/><text class="label" x="56" y="404">Chuyển active</text><text class="detail" x="56" y="432">Sau đó thu hồi asset cũ</text><path class="edge" d="M808 220V372"/><path class="edge" d="M696 416H592"/><path class="edge" d="M368 416H264"/><text class="detail" x="40" y="540">Rollback chỉ về corpus một dự án · Không có backup hội thoại</text></svg>
