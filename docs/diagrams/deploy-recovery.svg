s-serif" font-size="12.5" font-weight="400" fill="#62666d">test · deploy · verify</text><rect x="736" y="400" width="196" height="76" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="752" y="434" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Secrets</text><text x="752" y="458" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">Render/Pages/GitHub</text><path d="M149 400V360H488V204H524" fill="none" stroke="#805400" stroke-width="2" stroke-linejoin="round" marker-end="url(#deploy-recovery-arrow-accent)"/><rect x="288.5" y="336" width="83" height="22" rx="3" fill="#ffffff"/><text x="330" y="352" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">READ ONLY</text><path d="M349 400V372H512V216H524" fill="none" stroke="#805400" stroke-width="2" stroke-linejoin="round" marker-end="url(#deploy-recovery-arrow-accent)"/><rect x="360.5" y="348" width="139" height="22" rx="3" fill="#ffffff"/><text x="430" y="364" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">TOOL / GENERATION</text><text x="524" y="500" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">CI/CD deploy đúng SHA đã kiểm thử; secret không vào browser.</text><text x="40" y="592" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">Rollback: đặt EXECUTION_MODE=simple_rag và redeploy SHA 625e90e; giữ nguyên corpus/policy.</text><text x="40" y="616" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">Demo hiện tại không bật Turnstile; session, ingress HMAC và mọi quota vẫn hoạt động.</text>
