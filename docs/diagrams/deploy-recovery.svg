<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deploy-recovery-title deploy-recovery-desc" id="deploy-recovery-root"><title id="deploy-recovery-title">Triển khai và phục hồi</title><desc id="deploy-recovery-desc">Source đã kiểm thử được deploy đúng SHA; kiểm chứng live rồi chỉ cho phép rollback về phiên bản bảo toàn dữ liệu và phạm vi.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #deploy-recovery-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #deploy-recovery-root { font-family: var(--font-sans); color: var(--color-ink); }
      #deploy-recovery-root .diagram-container { width: 100%; overflow-x: auto; }
      #deploy-recovery-root .diagram-container { overflow-x: visible; }
      #deploy-recovery-root .node { fill:#fff;stroke:#4f5d75;stroke-width:1 }
      #deploy-recovery-root .focus { fill:#fff;stroke:#bf4520;stroke-width:2 }
      #deploy-recovery-root .label { font:500 18px 'Geist',system-ui,sans-serif;fill:#2d3142 }
      #deploy-recovery-root .detail { font:400 14px 'Geist',system-ui,sans-serif;fill:#4f5d75 }
      #deploy-recovery-root .heading { font:400 32px 'Instrument Serif',serif;fill:#2d3142 }
      #deploy-recovery-root .edge { fill:none;stroke:#4f5d75;stroke-width:1.5;marker-end:url(#deploy-recovery-arrow) }
      #deploy-recovery-root .life { fill:none;stroke:#4f5d75;stroke-width:1;stroke-dasharray:4 6 }</style><marker id="deploy-recovery-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#4f5d75"/></marker></defs><rect width="960" height="600" fill="#f5f5f5"/><text class="heading" x="40" y="56">Triển khai và phục hồi</text><rect class="node" x="40" y="132" width="224" height="88" rx="8"/><text class="label" x="56" y="164">Source đã kiểm thử</text><text class="detail" x="56" y="192">Commit SHA · CI</text><rect class="node" x="368" y="132" width="224" height="88" rx="8"/><text class="label" x="384" y="164">Deploy tuần tự</text><text class="detail" x="384" y="192">Render + Pages Functions</text><rect class="focus" x="696" y="132" width="224" height="88" rx="8"/><text class="label" x="712" y="164">Kiểm chứng live</text><text class="detail" x="712" y="192">SHA · corpus · fingerprint</text><path class="edge" d="M264 176H368"/><path class="edge" d="M592 176H696"/><rect class="node" x="696" y="372" width="224" height="88" rx="8"/><text class="label" x="712" y="404">Có sự cố</text><text class="detail" x="712" y="432">Tắt generation</text><rect class="focus" x="368" y="372" width="224" height="88" rx="8"/><text class="label" x="384" y="404">Restore riêng</text><text class="detail" x="384" y="432">Corpus-only · checksum</text><rect class="node" x="40" y="372" width="224" height="88" rx="8"/><text class="label" x="56" y="404">Khôi phục phù hợp</text><text class="detail" x="56" y="432">Một dự án · client history</text><path class="edge" d="M808 220V372"/><path class="edge" d="M696 416H592"/><path class="edge" d="M368 416H264"/><text class="detail" x="40" y="540">Thư viện nguồn vẫn hoạt động khi generation dừng</text></svg>
