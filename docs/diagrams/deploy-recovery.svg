<text x="40" y="52" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#202123">Triển khai, tin cậy và khôi phục</text><text x="40" y="76" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#62666d">Một Free Docker service trên Render, Pages Function ký mọi request; không có worker nền.</text><rect x="40" y="108" width="430" height="220" rx="6" fill="none" stroke="#dadde1" stroke-width="1" stroke-dasharray="5,4"/><text x="56" y="132" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">CLIENT / EDGE</text><rect x="500" y="108" width="460" height="220" rx="6" fill="none" stroke="#dadde1" stroke-width="1" stroke-dasharray="5,4"/><text x="516" y="132" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">RENDER FREE DOCKER</text><rect x="40" y="356" width="430" height="190" rx="6" fill="none" stroke="#dadde1" stroke-width="1" stroke-dasharray="5,4"/><text x="56" y="380" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">DATA / EXTERNAL</text><rect x="500" y="356" width="460" height="190" rx="6" fill="none" stroke="#dadde1" stroke-width="1" stroke-dasharray="5,4"/><text x="516" y="380" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10.5" fill="#62666d" letter-spacing="1">CI/CD + SECRETS</text><rect x="64" y="152" width="170" height="76" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="80" y="186" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Trình duyệt</text><text x="80" y="210" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">bearer session</text><rect x="264" y="152" width="170" height="76" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="280" y="186" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Cloudflare Pages</text><text x="280" y="210" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">Function ký HMAC</text><rect x="524" y="152" width="180" height="76" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="540" y="186" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">FastAPI</text><text x="540" y="210" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">mode=agentic_rag</text><rect x="736" y="152" width="196" height="76" rx="6" fill="#ffffff" stroke="#62666d" stroke-width="1"/><text x="752" y="186" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="#202123">Quota + lease</text><text x="752" y="210" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#62666d">session · IP · daily</text><path d="M234 190H264" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#deploy-recovery-arrow)"/><path d="M434 190H524" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#deploy-recovery-arrow)"/><path d="M704 190H736" fill="none" stroke="#62666d" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#deploy-recovery-arrow)"/><rect x="524" y="280" width="180" height="60" rx="6" fill="#f7f7f8" stroke="#62666d" stroke-width="1"/><text x="540" y="314" text-anchor="start" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="15" font-weight="600" fill="