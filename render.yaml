services:
  - type: web
    name: hanoi-land-law-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: IP_HASH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: EMBEDDING_MODEL
        value: multilingual-e5-small-onnx-q8-window-v1
      - key: EMBEDDING_PROVIDER
        value: local_onnx
      - key: EMBEDDING_DIMENSIONS
        value: 384
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
