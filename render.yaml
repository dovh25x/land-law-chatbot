services:
  - type: web
    name: hanoi-land-law-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: IP_HASH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_LLM_MODEL
        value: '@cf/qwen/qwen3-30b-a3b-fp8'
      - key: EMBEDDING_MODEL
        value: '@cf/baai/bge-m3'
      - key: EMBEDDING_PROVIDER
        value: cloudflare
      - key: EMBEDDING_DIMENSIONS
        value: 1024
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_AI_API_TOKEN
        sync: false
