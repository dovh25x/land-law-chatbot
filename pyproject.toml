[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hanoi-land-law"
version = "0.1.0"
description = "Evidence-first agentic RAG for Hanoi land law"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "langgraph>=1,<2", "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4", "beautifulsoup4>=4.13,<5", "pypdf>=5,<7",
  "pdfplumber>=0.11,<1", "typer>=0.16,<1", "python-dotenv>=1,<2", "cryptography>=46,<51", "fonttools>=4.58,<5",
  "onnxruntime>=1.20,<2", "sentencepiece>=0.2,<0.3", "numpy>=2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "respx>=0.22,<1", "ruff>=0.12,<1"]
ocr = ["pypdfium2>=4.30,<6", "Pillow>=11,<13"]

[project.scripts]
land-law = "landlaw.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
